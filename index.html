<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shannon Zhang 的个人网站，记录 AI、强化学习、RAG、agent 与推理项目。" />
    <title>shannon.zone</title>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/JetBrainsMono-400-italic.woff2" crossorigin />
    <script>
      (() => {
        const root = document.documentElement
        try { root.dataset.theme = localStorage.getItem('theme') || 'dark' } catch { root.dataset.theme = 'dark' }
        root.classList.add('fonts-pending')
        const reveal = () => {
          root.classList.remove('fonts-pending')
          root.classList.add('fonts-ready')
        }
        const timer = setTimeout(reveal, 2500)
        if (document.fonts) {
          document.fonts.load('italic 400 1em "JetBrains Mono Web"').then(() => {
            clearTimeout(timer)
            reveal()
          }, reveal)
        } else {
          reveal()
        }
      })()
    </script>
