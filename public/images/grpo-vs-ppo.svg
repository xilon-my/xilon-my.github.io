<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#57606a"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="20" font-weight="700" fill="#24292f">PPO 与 GRPO 的流程对比</text>
  <text x="20" y="54" font-size="12.5" fill="#57606a">PPO 需要一个 Critic 网络估分;GRPO 直接拿组内奖励的平均当基准,省掉 Critic——显存省了近一半</text>

  <!-- PPO row -->
  <text x="20" y="98" font-size="15" font-weight="700" fill="#24292f">PPO</text>

  <g font-size="12" fill="#24292f" text-anchor="middle">
    <rect x="20"  y="108" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <rect x="180" y="108" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <rect x="340" y="108" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <rect x="500" y="108" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <rect x="660" y="108" width="140" height="56" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="2"/>
    <rect x="820" y="108" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>

    <text x="90"  y="138" font-weight="700">prompt q</text>
    <text x="250" y="130" font-weight="700">Actor 策略 π_θ</text><text x="250" y="148" font-size="10" fill="#57606a">采样 1 个输出</text>
    <text x="410" y="138" font-weight="700">输出 o</text>
    <text x="570" y="130" font-weight="700">奖励模型</text><text x="570" y="148" font-size="10" fill="#57606a">打分 r</text>
    <text x="730" y="130" font-weight="700">Critic V(s)+GAE</text><text x="730" y="148" font-size="10" fill="#57606a">算优势 A_t</text>
    <text x="890" y="130" font-weight="700">更新</text><text x="890" y="148" font-size="10" fill="#57606a">Actor + Critic</text>
  </g>
  <line x1="160" y1="136" x2="178" y2="136" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="136" x2="338" y2="136" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="136" x2="498" y2="136" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="136" x2="658" y2="136" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="136" x2="818" y2="136" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GRPO row -->
  <text x="20" y="246" font-size="15" font-weight="700" fill="#24292f">GRPO</text>

  <g font-size="12" fill="#24292f" text-anchor="middle">
    <rect x="20"  y="256" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <rect x="180" y="256" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <rect x="340" y="256" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <rect x="500" y="256" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <rect x="660" y="256" width="140" height="56" rx="8" fill="#fff0f0" stroke="#cf222e" stroke-width="2" stroke-dasharray="5,3"/>
    <rect x="820" y="256" width="140" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>

    <text x="90"  y="286" font-weight="700">prompt q</text>
    <text x="250" y="278" font-weight="700">Actor 策略 π_θ</text><text x="250" y="296" font-size="10" fill="#57606a">采样 G=8 个</text>
    <text x="410" y="278" font-weight="700">输出 o₁…o_G</text><text x="410" y="296" font-size="10" fill="#57606a"></text>
    <text x="570" y="278" font-weight="700">规则奖励函数</text><text x="570" y="296" font-size="10" fill="#57606a">打分 r₁…r_G</text>
    <text x="730" y="278" font-weight="700">(r_i−mean)/std</text><text x="730" y="296" font-size="10" fill="#cf222e">组内优势 A_i,无 Critic</text>
    <text x="890" y="278" font-weight="700">更新</text><text x="890" y="296" font-size="10" fill="#57606a">只更新 Actor</text>
  </g>
  <line x1="160" y1="284" x2="178" y2="284" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="284" x2="338" y2="284" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="284" x2="498" y2="284" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="284" x2="658" y2="284" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="284" x2="818" y2="284" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="20" y="348" font-size="12" fill="#57606a">示意:参考 DeepSeekMath 论文与 TRL 文档自绘。GRPO 省掉 Critic 网络,优势直接用组内奖励归一化计算。</text>
</svg>
